<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SkyTech Solution | Future of Tech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="components/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }
        
        #heroSection {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .carousel,
        .carousel-inner,
        .carousel-item {
            height: 100%;
        }
        
        .carousel-item {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 3s ease-in-out;
        }
        
        .carousel-item.active {
            animation: zoomEffect 10s infinite alternate;
        }
        
        @keyframes zoomEffect {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.1);
            }
        }
        
        .bg-slider::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(2, 6, 23, 0.8) 0%, rgba(2, 6, 23, 0.4) 50%, rgba(2, 6, 23, 0.9) 100%);
            z-index: 1;
        }
        
        .hero-box {
            position: relative;
            z-index: 2;
            max-width: 900px;
            padding: 40px;
            text-align: center;
            animation: fadeInUp 1.5s ease-out;
        }
        
        .hero-box img {
            max-width: 500px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 20px rgba(14, 165, 233, 0.6));
        }
        
        h1 {
            font-weight: 800;
            font-size: 4rem;
            letter-spacing: -1px;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ffffff, #0ea5e9);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .lead {
            font-size: 1.25rem;
            color: #ffffff;
            margin-bottom: 30px;
            font-style: bold;
        }
        
        .accent-bar {
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, #0ea5e9, #6366f1);
            margin: 0 auto 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
        }
        
        .caption {
            position: absolute;
            bottom: 40px;
            right: 50px;
            text-align: right;
            z-index: 3;
            border-right: 4px solid #0ea5e9;
            padding-right: 20px;
        }
        
        .caption h3 {
            font-size: 1.5rem;
            color: #0ea5e9;
            margin-bottom: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(14, 165, 233, 0.3);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            .hero-box {
                padding: 20px;
            }
            .caption {
                position: relative;
                bottom: unset;
                right: unset;
                text-align: center;
                border-right: none;
                border-top: 2px solid #3b82f6;
                margin-top: 30px;
                padding-top: 15px;
            }
        }
    </style>
    <link href="components/responsive.css" rel="stylesheet">
</head>

<body>
    <div id="navbar"></div>

    <div id="heroSection">
        <div class="bg-slider">
            <div id="bgCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5000">
                <div class="carousel-inner">
                    <div class="carousel-item active" style="background-image: url('Assests/home.jpeg');"></div>
                    <div class="carousel-item" style="background-image: url('Assests/index.png');"></div>
                    <div class="carousel-item" style="background-image: url('Assests/net.jpg');"></div>
                </div>
            </div>
        </div>

        <div class="hero-box">
            <img src="Assests/skytech-logo.png" alt="SkyTech Logo">
            <div class="accent-bar"></div>
            <h1>SkyTech Solution</h1>
            <p class="lead">Empowering your world with safe, smart, and seamlessly connected modern technology.</p>
        </div>

        <div class="caption">
            <h3>Networking & CCTV</h3>
            <p class="small text-light text-uppercase opacity-75">Simplified methodology & devices</p>
        </div>
    </div>

    <div id="product"></div>
    <div id="footer"></div>

    <script src="include.js"></script>
    <script src="components/bootstrap.bundle.min.js"></script>

    <script>
        window.addEventListener('scroll', function() {
            let value = window.scrollY;
            let heroContent = document.querySelector('.hero-box');
            let heroBg = document.querySelector('.bg-slider');

            heroContent.style.opacity = 1 - value / 500;
            heroContent.style.transform = `translateY(${value * 0.4}px)`;

            heroBg.style.filter = `brightness(${1 - value / 1000})`;
        });
    </script>
</body>

</html>
